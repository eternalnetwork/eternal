<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="eternal — building the decentralized web">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1E242E"/>
    </pattern>
    <style>
      .flow { stroke-dasharray: 18 26; animation: flow 3.2s linear infinite; }
      .flow2 { stroke-dasharray: 18 26; animation: flow 3.2s linear infinite reverse; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 200px 200px; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes flow { to { stroke-dashoffset: -88; } }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
      @keyframes blink { 50% { opacity: 0; } }
      .t { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .m { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    </style>
  </defs>

  <rect width="1280" height="320" rx="18" fill="#0A0C10"/>
  <rect width="1280" height="320" rx="18" fill="url(#grid)"/>

  <!-- chain of blocks along the bottom -->
  <g stroke="#1E242E" stroke-width="2" fill="none">
    <rect x="760" y="250" width="34" height="34" rx="6"/>
    <line x1="794" y1="267" x2="822" y2="267"/>
    <rect x="822" y="250" width="34" height="34" rx="6"/>
    <line x1="856" y1="267" x2="884" y2="267"/>
    <rect x="884" y="250" width="34" height="34" rx="6"/>
    <line x1="918" y1="267" x2="946" y2="267"/>
    <rect x="946" y="250" width="34" height="34" rx="6" stroke="#F5B841" opacity=".7"/>
    <line x1="980" y1="267" x2="1008" y2="267"/>
    <rect x="1008" y="250" width="34" height="34" rx="6"/>
    <line x1="1042" y1="267" x2="1070" y2="267"/>
    <rect x="1070" y="250" width="34" height="34" rx="6" stroke="#4FD1B5" opacity=".7"/>
    <line x1="1104" y1="267" x2="1132" y2="267"/>
    <rect x="1132" y="250" width="34" height="34" rx="6"/>
  </g>

  <!-- mark -->
  <g transform="translate(70,50) scale(0.55)">
    <circle cx="200" cy="200" r="186" fill="none" stroke="#2A303B" stroke-width="3" stroke-dasharray="2 14.23"/>
    <path d="M200,200 C160,140 80,140 80,200 C80,260 160,260 200,200" fill="none" stroke="#F5B841" stroke-opacity=".25" stroke-width="14" stroke-linecap="round"/>
    <path d="M200,200 C240,140 320,140 320,200 C320,260 240,260 200,200" fill="none" stroke="#4FD1B5" stroke-opacity=".25" stroke-width="14" stroke-linecap="round"/>
    <path class="flow" d="M200,200 C160,140 80,140 80,200 C80,260 160,260 200,200" fill="none" stroke="#F5B841" stroke-width="14" stroke-linecap="round"/>
    <path class="flow2" d="M200,200 C240,140 320,140 320,200 C320,260 240,260 200,200" fill="none" stroke="#4FD1B5" stroke-width="14" stroke-linecap="round"/>
    <circle cx="125" cy="155" r="10" fill="#0A0C10" stroke="#F5B841" stroke-width="6"/>
    <circle cx="80" cy="200" r="10" fill="#0A0C10" stroke="#F5B841" stroke-width="6"/>
    <circle cx="125" cy="245" r="10" fill="#0A0C10" stroke="#F5B841" stroke-width="6"/>
    <circle cx="275" cy="155" r="10" fill="#0A0C10" stroke="#4FD1B5" stroke-width="6"/>
    <circle cx="320" cy="200" r="10" fill="#0A0C10" stroke="#4FD1B5" stroke-width="6"/>
    <circle cx="275" cy="245" r="10" fill="#0A0C10" stroke="#4FD1B5" stroke-width="6"/>
    <circle cx="200" cy="200" r="22" fill="#0A0C10" stroke="#ECE8DF" stroke-width="5"/>
    <circle class="pulse" cx="200" cy="200" r="11" fill="#ECE8DF"/>
  </g>

  <!-- wordmark -->
  <text x="340" y="150" class="t" font-size="104" font-weight="700" letter-spacing="-4" fill="#ECE8DF">eternal</text>
  <text x="344" y="200" class="m" font-size="22" fill="#9AA3B2">building the decentralized web<tspan class="blink" fill="#F5B841">_</tspan></text>
  <text x="344" y="244" class="m" font-size="16" fill="#6B7383">contracts <tspan fill="#F5B841">·</tspan> defi <tspan fill="#4FD1B5">·</tspan> zk <tspan fill="#F5B841">·</tspan> cross-chain <tspan fill="#4FD1B5">·</tspan> security</text>

  <!-- top right -->
  <text x="1210" y="62" class="m" font-size="14" fill="#6B7383" text-anchor="end">block #∞</text>
  <text x="1210" y="86" class="m" font-size="14" fill="#4FD1B5" text-anchor="end">● finalized</text>
</svg>
